<!doctype html>
<html><head><meta charset="utf-8"><title>explainer-short</title>
<style>
@font-face{font-family:'Inter';src:url(fonts/InterVariable.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'JBM';src:url(fonts/JetBrainsMono-Regular.woff2) format('woff2')}
:root{
  --ink:#1B1B1F; --mute:#8C867E; --bg:#F2EEE7; --bg-hi:#FBF8F3; --bg-lo:#E2DACE;
  --surface:#FFFFFF; --surface-2:#F6F3EE;
  --accent:#2F6BFF; --accent-2:#FF7A45; --accent-3:#2FB766;
  --chip-bg:rgba(22,22,26,.80); --chip-fg:#fff; --shadow:rgba(60,45,30,.25);
  --radius-card:34px; --radius-chip:20px; --chip-size:56px; --headline-weight:800;
  --font-sans:'Inter',sans-serif; --font-mono:'JBM',monospace;
}
html,body{margin:0;background:#000;overflow:hidden;width:1080px;height:1920px}
*{box-sizing:border-box}
#film{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--font-sans);color:var(--ink);font-feature-settings:'ss01','cv11'}
#spk{position:absolute;left:0;top:960px;width:1080px;height:960px;display:block;background:var(--bg-lo)}
#stage{position:absolute;left:0;top:0;width:1080px;height:960px;overflow:hidden;background:var(--bg);
  box-shadow:0 2px 0 rgba(255,255,255,.5) inset,0 14px 34px rgba(0,0,0,.28)}
#bg{position:absolute;inset:0;background-size:1080px 1920px}
.scene{position:absolute;left:0;top:0;width:1080px;display:none;transform-origin:540px 480px}
.scene.full{height:1920px;transform-origin:540px 960px}
.scene.split{height:960px}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.card{position:absolute;background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);border-radius:var(--radius-card);
  border:1px solid color-mix(in srgb, var(--ink) 8%, transparent);
  box-shadow:0 1.5px 0 rgba(255,255,255,1) inset,0 16px 34px -10px var(--shadow)}
.card.dark{background:linear-gradient(180deg,#2A2A2F 0%,#18181C 100%);border:1px solid rgba(255,255,255,.08);color:#fff}
.pill{position:absolute;display:flex;align-items:center;gap:14px;border-radius:999px;padding:14px 26px;font-weight:700;font-size:30px;white-space:nowrap;
  background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid rgba(40,30,20,.07);box-shadow:0 10px 24px -8px var(--shadow)}
.dot{width:16px;height:16px;border-radius:50%;flex:none;background:var(--accent)}
#cap{position:absolute;left:540px;top:960px;transform:translate(-50%,-50%);z-index:20;padding:10px 26px 14px;border-radius:var(--radius-chip);
  background:var(--chip-bg);color:var(--chip-fg);font-weight:var(--headline-weight);font-size:var(--chip-size);letter-spacing:-.012em;line-height:1.08;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.22);display:none}
.mono{font-family:var(--font-mono)}
.chip{position:absolute;border-radius:999px;padding:8px 18px;font-size:24px;font-weight:700;color:#fff;white-space:nowrap;background:var(--accent)}
</style></head><body>
<div id="film">
  <canvas id="spk" width="1080" height="960"></canvas>
  <div id="stage"><div id="bg"></div></div>
  <div id="cap"></div>
</div>
<script type="module" src="main.js"></script>
</body></html>
